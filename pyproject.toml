[project]
name = "unskein"
version = "0.1.0"
description = "AI-assisted static analysis CLI that untangles module dependencies, coupling and cycles in Python projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Ángel Poveda Lorenzo", email = "mapovedalorenzo@gmail.com" }]
requires-python = ">=3.12"
keywords = ["static-analysis", "dependencies", "coupling", "architecture", "cli", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "litellm>=1.95.0,<2",
    "networkx>=3.3",
    "pathspec>=0.12",
    "psutil>=6.0",
    "pydantic>=2.8",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
unskein = "unskein.cli:run"

[project.urls]
Homepage = "https://github.com/mapenzo/unskein"
Issues = "https://github.com/mapenzo/unskein/issues"
Changelog = "https://github.com/mapenzo/unskein/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unskein"]

[tool.hatch.build.targets.sdist]
exclude = ["/graft", "/.claude", "/.mcp.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
norecursedirs = ["tests/fixtures"]

[tool.coverage.run]
source = ["unskein"]
branch = true

[tool.pylint.main]
# Fixture projects are deliberately odd code (cycles, unused re-exports).
ignore-paths = ["tests/fixtures"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
# Config and options dataclasses are plain data bags (AnalysisConfig has 11 fields).
max-attributes = 12

[tool.pylint."messages control"]
disable = [
    # Docstrings are enforced by ruff's D rules and tests/integration/test_docstrings.py,
    # which also exempt tests on purpose (descriptive names instead, see CLAUDE.md).
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Dataclasses and Pydantic models legitimately have no public methods.
    "too-few-public-methods",
    # Tests prefer explicit comparisons (== [], == 0, == "") for readable failures.
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D"]
# __init__ arguments are documented in the class docstring (Google style).
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: descriptive names instead of docstrings (see CLAUDE.md, Clean Code).
"tests/**" = ["D"]
