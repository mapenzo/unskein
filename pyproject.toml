[project]
name = "unskein"
version = "0.1.0"
description = "AI-assisted static analysis CLI that untangles module dependencies, coupling and cycles in Python projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Ángel Poveda Lorenzo", email = "mapovedalorenzo@gmail.com" }]
requires-python = ">=3.12"
keywords = ["static-analysis", "dependencies", "coupling", "architecture", "cli", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "litellm>=1.50",
    "networkx>=3.3",
    "pathspec>=0.12",
    "psutil>=6.0",
    "pydantic>=2.8",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
unskein = "unskein.cli:app"

[project.urls]
Homepage = "https://github.com/mapenzo/unskein"
Issues = "https://github.com/mapenzo/unskein/issues"
Changelog = "https://github.com/mapenzo/unskein/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unskein"]

[tool.hatch.build.targets.sdist]
exclude = ["/graft", "/.claude", "/.mcp.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
norecursedirs = ["tests/fixtures"]

[tool.coverage.run]
source = ["unskein"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
