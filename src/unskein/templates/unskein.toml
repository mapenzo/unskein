# unskein configuration, generated by `unskein init`.
#
# Every setting is commented out and shows its default, so this file changes
# nothing until you uncomment a line. Precedence, highest first:
#   command-line flag > environment variable > this file > default.
# The project's .unskein.toml wins over ~/.config/unskein/config.toml key by key.

[general]
# Output language: "es" or "en". Default: your system locale if Spanish,
# English otherwise. Also set by --lang or UNSKEIN_LANG.
# lang = "en"

[ai]
# LiteLLM model name. Without one, the report has no AI section.
# Env var: UNSKEIN_AI_MODEL. Examples: "ollama/qwen2.5-coder:7b", "gpt-4o-mini".
# model = "ollama/qwen2.5-coder:7b"

# Endpoint for local servers or a LiteLLM Proxy. Env var: UNSKEIN_AI_API_BASE.
# api_base = "http://localhost:11434"

# Prefer the UNSKEIN_API_KEY env var: a key written here can end up in git.
# api_key = ""

[analysis]
# Extra paths to skip, gitignore syntax. Added to .gitignore, .unskeinignore
# and --exclude, never replacing them. "migrations/" matches at any depth.
# exclude = []

# Where your top-level packages live. Default: src/ if the project uses the
# src layout, and the project root always as a fallback.
# source_roots = ["src"]

# Analyze test code too (tests/, test_*.py, *_test.py, conftest.py).
# include_tests = false

# Follow symlinked directories. Off by default: a symlink can loop or leave
# the project.
# follow_symlinks = false

# Encoding for files that declare none and cannot be detected. Never
# overrides a PEP 263 coding cookie or a BOM.
# default_encoding = "utf-8"

# Files at or above this size are skipped with a warning (5 MB).
# max_file_size_bytes = 5242880

# Seconds to wait for one file in parallel parsing before skipping it.
# per_file_timeout_seconds = 30

# Parse in parallel from this many files; below it, starting processes
# costs more than it saves.
# parallel_threshold = 500

# Parallel parsing workers. Default: the number of cores, at most 8.
# max_workers = 8

# Files handed to the workers at a time.
# queue_maxsize = 200
